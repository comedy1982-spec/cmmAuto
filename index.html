<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bybit 크립토 모니터</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 사이드바 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo">⬡</span>
        <span class="logo-text">Bybit Monitor</span>
      </div>

      <div class="search-box">
        <input type="text" id="coinSearch" placeholder="코인 검색..." autocomplete="off" />
      </div>

      <div class="coin-list" id="coinList"></div>

      <div class="sidebar-footer">
        <div class="auto-refresh">
          <label class="toggle-label">
            <input type="checkbox" id="autoRefresh" checked />
            <span class="toggle-slider"></span>
          </label>
          <span>자동 갱신</span>
        </div>
        <div id="lastUpdate" class="last-update">-</div>
      </div>
    </aside>

    <!-- 메인 콘텐츠 -->
    <main class="main">
      <div class="main-header">
        <div class="coin-info">
          <span class="coin-symbol" id="currentSymbol">BTCUSDT</span>
          <span class="coin-price" id="currentPrice">-</span>
          <span class="coin-change" id="priceChange">-</span>
        </div>

        <div class="interval-selector" id="intervalSelector">
          <button class="interval-btn" data-interval="1">1분</button>
          <button class="interval-btn" data-interval="5">5분</button>
          <button class="interval-btn" data-interval="15">15분</button>
          <button class="interval-btn" data-interval="30">30분</button>
          <button class="interval-btn active" data-interval="60">1시간</button>
          <button class="interval-btn" data-interval="240">4시간</button>
          <button class="interval-btn" data-interval="720">12시간</button>
          <button class="interval-btn" data-interval="D">1일</button>
          <button class="interval-btn" data-interval="W">1주</button>
        </div>
      </div>

      <div class="chart-container">
        <div id="chartArea"></div>
        <div class="chart-overlay" id="chartOverlay">
          <div class="loading-spinner"></div>
          <span>데이터 로딩 중...</span>
        </div>
      </div>

      <div class="stats-row" id="statsRow">
        <div class="stat-card">
          <span class="stat-label">시가</span>
          <span class="stat-value" id="statOpen">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">고가</span>
          <span class="stat-value positive" id="statHigh">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">저가</span>
          <span class="stat-value negative" id="statLow">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">종가</span>
          <span class="stat-value" id="statClose">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">거래량</span>
          <span class="stat-value" id="statVolume">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">24h 고가</span>
          <span class="stat-value positive" id="stat24High">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">24h 저가</span>
          <span class="stat-value negative" id="stat24Low">-</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">24h 거래대금</span>
          <span class="stat-value" id="stat24Turnover">-</span>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
